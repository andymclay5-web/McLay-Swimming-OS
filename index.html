<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d4566">
<title>McLay Swimming OS — Version 4</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css?v=20260816-core401">
<link rel="stylesheet" href="v4-correct.css?v=20260817-transcriptfinal">
<link rel="stylesheet" href="v4-poolside-core.css?v=20260817e">
</head>
<body>
<header class="app-header">
  <div class="top-row">
    <select id="sessionSelect" aria-label="Session"></select>
    <button id="newSessionBtn" class="plus-btn" aria-label="New session">＋</button>
    <button id="guardianShortcut" class="guard-btn">Guardian</button>
  </div>
  <div class="squad-row"><div id="squadTabs" class="squad-tabs"></div><button id="wakeBtn" class="wake-btn">Keep awake</button><button id="tvModeBtn" class="wake-btn">TV Board</button><button id="meetModeBtn" class="wake-btn">Meet</button><span id="roleBadge" class="role-badge">Owner</span><span id="buildBadge" class="build-badge">v4</span></div>
</header>
<main id="appMain">
  <section id="boardView" class="view active"></section>
  <section id="tvView" class="view"></section>
  <section id="hubView" class="view"></section>
  <section id="swimmerView" class="view"></section>
  <section id="meetView" class="view"></section>
  <section id="athletesView" class="view"></section>
  <section id="rollView" class="view"></section>
  <section id="timesView" class="view"></section>
  <section id="connectionView" class="view"></section>
  <section id="guardianView" class="view"></section>
</main>
<div class="sticky-actions">
 <button data-sticky-note>Note</button><button data-sticky-voice>Voice</button><button data-sticky-video>Video</button><button data-sticky-edit>Edit</button><button data-sticky-finish>Finish</button>
</div>
<nav class="bottom-nav">
 <button data-nav="board" class="active"><span>▤</span>Board</button>
 <button data-nav="hub"><span>◉</span>Coach Hub</button>
 <button data-nav="roll"><span>✓</span>Roll</button>
 <button data-nav="times"><span>◷</span>Times</button>
</nav>
<button id="undoBtn" class="undo-fab" aria-label="Undo last live edit">Undo</button>
<div id="toast" class="toast"></div>
<div id="modalHost"></div>
<script src="config.js"></script>
<script src="seed.js"></script>
<script src="app.js?v=20260819c-reloadgate" defer></script>
<script src="v4-correct.js?v=20260819c-reloadgate" defer></script>
<script src="v4-poolside-core.js?v=20260819c-reloadgate" defer></script>
</body>
</html>
