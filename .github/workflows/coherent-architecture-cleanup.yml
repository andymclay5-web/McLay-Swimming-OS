name: Coherent architecture cleanup
on:
  push:
    branches: [rebuild/msos-coherent-product-20260826]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'actions'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/msos-coherent-product-20260826
          fetch-depth: 0
      - name: Consolidate runtime ownership and install explicit surface bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Explicit cross-surface bridge. Feature engines register post-render hooks;
          # they never capture and replace another engine's public function.
          Path('engines/surface-bridge.js').write_text(r'''\'use strict\';
          (function(g){
            const M=g.MSOS4;if(!M)return;
            const hooks=new Map(),pending=new Set(),running=new Set();
            const B=M.surfaceBridge={build:'v4-surface-bridge-20260826',hooks};
            const list=surface=>{if(!hooks.has(surface))hooks.set(surface,new Map());return hooks.get(surface)};
            B.register=(surface,id,fn)=>{if(!surface||!id||typeof fn!=='function')throw new Error('surfaceBridge.register requires surface, id, fn');list(surface).set(id,fn);return()=>list(surface).delete(id)};
            B.after=(surface,ctx={})=>{if(!surface||running.has(surface))return;running.add(surface);try{for(const [id,fn] of list(surface)){try{fn(ctx)}catch(e){console.warn(`[MSOS bridge:${surface}:${id}]`,e)}}}finally{running.delete(surface)}};
            const schedule=(surface,ctx={})=>{if(!surface||pending.has(surface))return;pending.add(surface);const run=()=>{pending.delete(surface);B.after(surface,ctx)};(g.requestAnimationFrame||((fn)=>setTimeout(fn,0)))(run)};
            B.schedule=schedule;
            const surfaceFor=node=>{const el=node?.nodeType===1?node:node?.parentElement;if(!el)return'';const host=el.closest?.('#boardView,#tvView,#hubView,#swimmerView,#meetView,#athletesView,#rollView,#timesView,#connectionView,#guardianView,#modalHost');if(!host)return'';if(host.id==='modalHost')return'modal';return host.id.replace(/View$/,'');};
            B.install=()=>{if(B.installed||typeof document==='undefined')return;B.installed=true;const observer=new MutationObserver(records=>{for(const r of records){const s=surfaceFor(r.target);if(s)schedule(s,{host:s==='modal'?document.querySelector('#modalHost .modal'):document.querySelector(`#${s}View`),source:'mutation'});}});observer.observe(document.body,{subtree:true,childList:true});B.observer=observer;for(const s of ['board','tv','hub','swimmer','meet','athletes','roll','times']){const h=document.querySelector(`#${s}View`);if(h?.classList.contains('active')||h?.childElementCount)schedule(s,{host:h,source:'install'});}const modal=document.querySelector('#modalHost .modal');if(modal)schedule('modal',{host:modal,source:'install'});};
            if(typeof document!=='undefined'){if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',B.install,{once:true});else B.install();}
          })(globalThis);
          ''')

          # Load the bridge immediately after the core shell so all later feature engines can register hooks.
          p=Path('index.html'); s=p.read_text()
          bridge='<script src="engines/surface-bridge.js?v=20260826-coherent-r1" defer></script>'
          if bridge not in s:
              marker='<script src="app.js?v=20260826-coherent-r1" defer></script>'
              if marker not in s: raise SystemExit('index app marker missing')
              s=s.replace(marker,marker+bridge,1)
          p.write_text(s)

          # Coach-loop keeps its useful feature modules, but registers them through the bridge
          # instead of capturing/replacing Board, Swimmer, Meet, Athlete, or Capture owners.
          p=Path('engines/coach-loop-ui.js'); s=p.read_text()
          start=s.find('  // Install wrappers after all existing v4 engines so we extend rather than')
          end=s.find("  addEventListener('msos:evidence-ready'",start)
          if start<0 or end<0: raise SystemExit('coach-loop wrapper region missing')
          replacement=r'''  // Cross-surface enhancements are explicit bridge consumers, never owner wrappers.
          UI.renderHub=renderCoachHub;
          const surfaceBridge=M.surfaceBridge;
          surfaceBridge?.register?.('board','coach-loop-board-athletes',()=>installBoardAthletes());
          surfaceBridge?.register?.('athletes','coach-loop-athlete-today',()=>{enhanceAthleteToday();observeAthletes();});
          surfaceBridge?.register?.('swimmer','coach-loop-swimmer-feedback',()=>enhanceSwimmerDevice());
          surfaceBridge?.register?.('meet','coach-loop-meet-intake',()=>installMeetIntake());
          surfaceBridge?.register?.('modal','coach-loop-capture-upgrade',({host}={})=>{const modal=host||document.querySelector('#modalHost .modal');if(modal?.querySelector('#captureStatus,[data-save-note],[data-capture-athlete]'))upgradeCaptureModal(modal);});

          '''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)

          # Remove the obsolete app Guardian wrapper IIFE. The foundation suite remains
          # G.foundationRun; engines/guardian-runtime.js is the sole public Guardian owner.
          p=Path('app.js'); s=p.read_text()
          marker=' const priorRun=M.guardian.run;'
          pos=s.find(marker)
          if pos>=0:
              a=s.rfind('(function(g){',0,pos); b=s.find('})(globalThis);',pos)
              if a<0 or b<0: raise SystemExit('app obsolete Guardian IIFE boundary missing')
              s=s[:a]+'// Legacy Guardian wrapper retired; guardian-runtime owns public execution.\n'+s[b+len('})(globalThis);'):]
          p.write_text(s)

          # Remove the poolside Guardian wrapper, retaining the poolside engine and self-test.
          p=Path('v4-poolside-core.js'); s=p.read_text()
          a=s.find('  const priorGuardianRun=M.guardian?.run?.bind(M.guardian);')
          b=s.find("  document.addEventListener('DOMContentLoaded'",a)
          if a>=0:
              if b<0: raise SystemExit('poolside Guardian wrapper end missing')
              s=s[:a]+'  // Poolside self-test remains local; public Guardian execution is owned by guardian-runtime.\n'+s[b:]
          p.write_text(s)

          # v4-correct previously wrapped M.adapt.item before the real Modification/Bridge
          # engine loaded. It was overwritten later and therefore was not runtime truth.
          # Remove that dead captured generation; modification.js + bridge.js own adaptation.
          p=Path('v4-correct.js'); s=p.read_text()
          a=s.find('  if(M.adapt?.item){')
          b=s.find('  // ---------- T400 / aerobic target truth ----------',a)
          if a>=0:
              if b<0: raise SystemExit('v4-correct adaptation wrapper end missing')
              s=s[:a]+'  // Public adaptation is owned by engines/modification.js through engines/bridge.js.\n\n'+s[b:]
          # Coach Hub is owned by coach-loop-ui. Remove any stale direct Hub assignment here.
          s=s.replace('    M.ui.renderHub=renderCoachHub;\n','').replace('    UI.renderHub=renderCoachHub;\n','')
          p.write_text(s)

          # The final swimmer surface is the athlete renderer owner. Keep legacy feature
          # entry points pointing at that owner without wrapping it.
          p=Path('engines/swimmer-instant-open-cn.js'); s=p.read_text()
          old="function install(){if(X.installed)return;X.installed=true;M.ui.renderAthletes=()=>{X._start=performance.now();return renderFast();};}"
          new="function install(){if(X.installed)return;X.installed=true;M.ui.renderAthletes=()=>{X._start=performance.now();return renderFast();};if(M.performanceUI)M.performanceUI.render=M.ui.renderAthletes;}"
          if old not in s: raise SystemExit('swimmer install owner marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          # Structural gate audits only scripts actually loaded by index.html. Historical
          # recovery files can stay in the repository without becoming runtime owners.
          p=Path('.github/workflows/coherent-product-acceptance.yml'); s=p.read_text()
          a=s.find('      - name: Structural single-owner audit')
          b=s.find('      - name: Run current non-browser contract tests',a)
          if a<0 or b<0: raise SystemExit('acceptance structural step boundary missing')
          step=r'''      - name: Structural single-owner audit
            shell: bash
            run: |
              set -euo pipefail
              python3 - <<'PY2'
              from pathlib import Path
              import re, sys
              html=Path('index.html').read_text()
              active=[]
              for src in re.findall(r'<script[^>]+src="([^"]+\.js)(?:\?[^\"]*)?"',html):
                  path=src.split('?',1)[0]
                  if Path(path).exists(): active.append(path)
              text={f:Path(f).read_text(errors='ignore') for f in active}
              checks={
                'parser':(r'\b(?:M\.parser|P)\.parse\s*=',{'engines/parser-semantics.js'}),
                'board':(r'\b(?:M\.ui|UI)\.renderBoard\s*=',{'engines/board.js'}),
                'tv':(r'\b(?:M\.ui|UI)\.renderTV\s*=',{'engines/board.js'}),
                'navigation':(r'\b(?:M\.navigationEngine|V)\.go\s*=',{'engines/navigation.js'}),
                'adaptation':(r'\b(?:M\.adapt|A)\.item\s*=',{'engines/bridge.js'}),
                'guardian':(r'\b(?:M\.guardian|G)\.run\s*=',{'engines/guardian-runtime.js'}),
                'athletes':(r'\b(?:M\.ui|UI)\.renderAthletes\s*=',{'engines/swimmer-instant-open-cn.js'}),
                'coach hub':(r'\b(?:M\.ui|UI)\.renderHub\s*=',{'engines/coach-loop-ui.js'}),
              }
              failed=[]
              for label,(pat,expected) in checks.items():
                  hits=[];rx=re.compile(pat)
                  for f,t in text.items():
                      for m in rx.finditer(t): hits.append((f,t.count('\n',0,m.start())+1))
                  owners={f for f,_ in hits}
                  print(label,hits)
                  if owners!=expected: failed.append((label,hits,sorted(expected)))
              forbidden=[
                r'baseRenderBoard\s*=\s*(?:M\.ui|UI)\.renderBoard',
                r'baseRenderTV\s*=\s*(?:M\.ui|UI)\.renderTV',
                r'BASE_PARSE\s*=\s*M\.parser\.parse',
                r'baseGuardianRun\s*=\s*M\.guardian\.run',
                r'baseBoard\s*=\s*UI\.renderBoard',
                r'baseAthletes\s*=\s*UI\.renderAthletes',
                r'baseSwimmer\s*=\s*UI\.renderSwimmer',
                r'baseMeet\s*=\s*UI\.renderMeet',
                r'baseOpenCapture\s*=\s*M\.actions\.openCapture',
              ]
              bad=[]
              for f,t in text.items():
                  for pat in forbidden:
                      if re.search(pat,t): bad.append((f,pat))
              if bad: failed.append(('captured owner wrappers',bad,[]))
              if failed:
                  print('STRUCTURAL_OWNER_AUDIT_FAIL',failed)
                  sys.exit(1)
              print('STRUCTURAL_OWNER_AUDIT_PASS',len(active),'active scripts')
              PY2
          '''
          s=s[:a]+step+s[b:]
          p.write_text(s)
          PY
          node --check engines/surface-bridge.js
          node --check app.js
          node --check v4-correct.js
          node --check v4-poolside-core.js
          node --check engines/coach-loop-ui.js
          node --check engines/swimmer-instant-open-cn.js
      - name: Commit coherent architecture cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MSOS coherent rebuild'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html engines/surface-bridge.js engines/coach-loop-ui.js engines/swimmer-instant-open-cn.js app.js v4-correct.js v4-poolside-core.js .github/workflows/coherent-product-acceptance.yml
          git commit -m 'Consolidate runtime owners through explicit surface bridge'
          git push origin HEAD:rebuild/msos-coherent-product-20260826
