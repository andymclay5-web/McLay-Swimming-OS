name: Rebuild engine tests

on:
  push:
    branches:
      - rebuild/engine-contracts-v1
    paths:
      - 'engines/**'
      - 'ui/**'
      - 'tests/**'
      - 'REBUILD_ENGINE_CONTRACTS.md'
      - 'REBUILD_STATUS.md'
      - '.github/workflows/rebuild-engine-tests.yml'
  workflow_dispatch:

jobs:
  session-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check Session Truth
        run: node --check engines/session-truth.js
      - name: Session Truth isolated regressions
        run: |
          for f in tests/session-truth*.test.js; do
            echo "Running $f"
            node "$f"
          done

  session-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check Session Lifecycle
        run: node --check engines/session-lifecycle.js
      - name: Session Lifecycle isolated regressions
        run: node tests/session-lifecycle.test.js

  evidence-retrieval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check Evidence Retrieval
        run: node --check engines/evidence-retrieval.js
      - name: Evidence Retrieval isolated regressions
        run: |
          for f in tests/evidence*.test.js; do
            echo "Running $f"
            node "$f"
          done

  results-pathway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check Results Pathway
        run: node --check engines/results-pathway.js
      - name: Results Pathway isolated regressions
        run: node tests/results-pathway.test.js

  targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check Target Engine
        run: node --check engines/targets.js
      - name: Target Engine isolated regressions
        run: node tests/targets.test.js

  adaptation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check Adaptation Engine
        run: node --check engines/adaptation.js
      - name: Adaptation Engine isolated regressions
        run: node tests/adaptation.test.js

  attendance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check Attendance Engine
        run: node --check engines/attendance.js
      - name: Attendance Engine isolated regressions
        run: node tests/attendance.test.js

  board-projection:
    runs-on: ubuntu-latest
    needs: [session-truth, targets, adaptation, attendance]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check Board Projection
        run: node --check engines/board-projection.js
      - name: Syntax check Board Renderer
        run: node --check ui/board-renderer.js
      - name: Board Projection isolated regressions
        run: node tests/board-projection.test.js
      - name: Board Renderer isolated regressions
        run: node tests/board-renderer.test.js
