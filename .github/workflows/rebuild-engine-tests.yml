name: Rebuild engine tests

on:
  push:
    branches:
      - rebuild/engine-contracts-v1
    paths:
      - 'engines/**'
      - 'tests/**'
      - 'REBUILD_ENGINE_CONTRACTS.md'
      - '.github/workflows/rebuild-engine-tests.yml'
  workflow_dispatch:

jobs:
  session-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check Session Truth
        run: node --check engines/session-truth.js
      - name: Session Truth isolated regressions
        run: |
          for f in tests/session-truth*.test.js; do
            echo "Running $f"
            node "$f"
          done

  session-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check Session Lifecycle
        run: node --check engines/session-lifecycle.js
      - name: Session Lifecycle isolated regressions
        run: node tests/session-lifecycle.test.js
