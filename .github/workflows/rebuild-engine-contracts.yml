name: Rebuild engine contracts

on:
  push:
    branches: [rebuild/engine-contracts-v1]
    paths:
      - 'engines/**'
      - 'tests/session-truth-contract.test.js'
      - 'ENGINE_CATALOG.md'
      - 'REBUILD_ENGINE_CONTRACTS.md'
      - '.github/workflows/rebuild-engine-contracts.yml'
  workflow_dispatch:

jobs:
  session-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Session Truth syntax
        run: node --check engines/session-truth.js
      - name: Session Truth isolated contract
        run: node tests/session-truth-contract.test.js
