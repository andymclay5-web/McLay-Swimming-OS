name: Swimmer Surface Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  swimmer-surface:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check engines/evidence.js
          node --check engines/swimmer-performance-ci.js
          node --check engines/swimmer-experience-cl.js
          node --check engines/swimmer-performance-compact-cm.js
          node --check engines/swimmer-invite-bn.js
          node --check engines/swimmer-instant-open-cn.js
          node --check swimmer-portal.js
          node --check vendor/qrcode.min.js
          node --check tests/swimmer-secure-preview-static-20260907.cjs
          node --check tests/swimmer-portal-preview-browser-20260907.cjs
      - name: Swimmer surface contract
        run: node tests/swimmer-surface-co.cjs
      - name: Secure preview and invite contract
        run: node tests/swimmer-secure-preview-static-20260907.cjs
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Start candidate
        run: |
          python3 -m http.server 8765 >/tmp/msos-swimmer-preview-http.log 2>&1 &
          echo $! >/tmp/msos-swimmer-preview-http.pid
          sleep 1
      - name: Coach preview uses exact swimmer renderer without writes
        run: node tests/swimmer-portal-preview-browser-20260907.cjs
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/msos-swimmer-preview-http.log || true
