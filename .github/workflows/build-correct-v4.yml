name: Build Correct Version 4
on:
  push:
    paths:
      - '.v4build/go'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify transfer chunks
        shell: bash
        run: |
          set -euo pipefail
          check_part(){ got="$(tr -d '\n' < ".v4build/$1" | sha256sum | awk '{print $1}')"; test "$got" = "$2" || { echo "$1 mismatch: $got"; exit 1; }; echo "$1 OK"; }
          check_part part01.b64 cf0cdcf208bcd843ad55ebb33d273f237ae83e2d60e216aa0c8365c9e0b5c4b1
          check_part part02.b64 4df113c71901cc299ae40b9b68ec51653bf2e54f3929416656ca5a2bc29a48bf
          check_part part03.b64 617c2b78dab5d73a766b51b61bbe09d70f1e79bdd7af1bf28f7a14a8bd40ab7d
          check_part part04.b64 b3eeb312b351a383e295d48ec95d53df6e7eac8053b215b28879ef4ef30cdaf3
          check_part part05.b64 451fe7544807c34d02035b1ed7c6fe6c3a41d9919bb4ea6918515d26b4302b96
          check_part part06.b64 6672316263c215b74c3df99c7c3c7c9a33b51fb8e66f640c0d0fa95b185f912d
          check_part part07.b64 a90ab5c5de2b57ab9a635b888e59637a3686e5565817675bf9f4229db26385da
          check_part part08.b64 791ae1a5b20bf84847a38974d0482fff8931e8369ccb0793e7e6734177f49ddd
          check_part part09.b64 9305512fc52810a40b947be77acc93a9ccee189c134a09eed4c9ab2695338b9a
          check_part part10a.b64 c49fae9beebe2c8fe39083fcfdfd1e6bdbb47e247ed7b8900b45535c981fcae3
          check_part part10b.b64 81d71d414441eb730103f75324c690b791366ccee731ce5a8b1006f12724095b
      - name: Reconstruct and validate correction
        shell: bash
        run: |
          set -euo pipefail
          { cat .v4build/part01.b64 .v4build/part02.b64 .v4build/part03.b64 .v4build/part04.b64 .v4build/part05.b64 .v4build/part06.b64 .v4build/part07.b64 .v4build/part08.b64 .v4build/part09.b64 .v4build/part10a.b64 .v4build/part10b.b64; } | tr -d '\n' | base64 -d > v4-correct.js
          test "$(wc -c < v4-correct.js)" = '84097'
          echo '18788d42cc3004b3052b3df1ed376efdda348e0b40e45809ae3ae6b3ae1a7aee  v4-correct.js' | sha256sum -c -
          node --check v4-correct.js
          grep -q "Poolside voice evidence: audio local-first + transcript" v4-correct.js
          grep -q "M.BUILD='v4-correct-20260817-transcriptfinal'" v4-correct.js
      - name: Commit validated correction and remove transfer material
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .v4build
          git rm .github/workflows/build-correct-v4.yml
          git add v4-correct.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build validated Correct Version 4 correction source'
          git push
