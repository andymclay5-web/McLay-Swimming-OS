name: Cleanup V4 transfer
on:
  push:
    paths:
      - '.cleanup-v4-transfer'
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary transfer material
        run: |
          set -euo pipefail
          rm -rf .v4build .cleanup-v4-transfer
          git rm .github/workflows/cleanup-v4-transfer.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary Version 4 transfer files'
          git push
