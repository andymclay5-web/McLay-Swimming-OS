name: Rebuild validation
on:
  push:
    branches: [rebuild/msos-coherent-product-20260826]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax active runtime
        run: |
          node --check app.js
          for f in v4-correct.js v4-poolside-core.js engines/*.js architecture/*.js; do node --check "$f"; done
      - name: Existing product gates
        run: |
          set -e
          node tests/engine-acceptance.cjs
          node tests/friday-session-board-regression.cjs
          node tests/board-evidence-regression.cjs
          node tests/architecture-foundation.cjs
          node tests/guardian-current-runtime-bl.cjs
          node tests/live-contract-20260823.cjs
          node tests/swimmer-surface-acceptance-20260824.cjs
          node tests/final-product-acceptance-20260825.cjs
          node tests/all-inclusive-product-acceptance-20260825.cjs
      - name: Working tree clean
        run: git diff --check
