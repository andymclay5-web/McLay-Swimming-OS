name: Coherent parser semantic repair
on:
  push:
    branches: [rebuild/msos-coherent-product-20260826]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'actions'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/msos-coherent-product-20260826
      - name: Preserve authored zone transitions and written totals
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('engines/parser-semantics.js');s=p.read_text()

          marker="  function repairSet(item){if(!item||item.kind!=='set')return;"
          transition="""  function preserveZoneTransition(item,all){const reps=Math.max(1,Number(item?.reps)||1),m=String(all||'').match(/\\b(Regeneration|Regen|Reg|Development|Dev|Overload|OL|Threshold|Thr|Clearance|CL)\\s+(?:to|→|->)\\s+(Regeneration|Regen|Reg|Development|Dev|Overload|OL|Threshold|Thr|Clearance|CL)\\b/i);if(!m||reps<2)return false;const first=zoneName(m[1]),second=zoneName(m[2]);if(!first||!second||first===second)return false;const split=Math.ceil(reps/2);item.repPattern=Array.from({length:reps},(_,i)=>({rep:i+1,zone:i<split?first:second,text:i<split?first:second}));item.zone='';return true}\n"""
          if marker not in s: raise SystemExit('repairSet marker missing')
          if 'function preserveZoneTransition' not in s:
              s=s.replace(marker,transition+marker,1)
          old='preserveZoneRanges(item,all);item.pattern=item.pattern||[];'
          new='if(!preserveZoneRanges(item,all))preserveZoneTransition(item,all);item.pattern=item.pattern||[];'
          if old not in s: raise SystemExit('zone range call marker missing')
          s=s.replace(old,new,1)

          old="session.metadata.parserPreparedHash=U.hash(prepared);session.metadata.parsedTotal=S.total(session);"
          new="session.metadata.parserPreparedHash=U.hash(prepared);const written=src.match(/(?:^|\\n)\\s*(?:TOTAL\\s*)?(\\d{3,5}(?:\\.\\d+)?)\\s*m(?:etres?)?\\s*$/i);if(session.metadata.explicitTotal==null&&written)session.metadata.explicitTotal=Number(written[1]);session.metadata.parsedTotal=S.total(session);"
          if old not in s: raise SystemExit('parser metadata marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check engines/parser-semantics.js
          node tests/parser-natural-cw.cjs
          node tests/friday-session-board-regression.cjs
      - name: Commit semantic repair
        shell: bash
        run: |
          git config user.name 'MSOS coherent rebuild'
          git config user.email 'actions@users.noreply.github.com'
          git add engines/parser-semantics.js
          git commit -m 'Preserve zone transitions and authored total truth'
          git push origin HEAD:rebuild/msos-coherent-product-20260826
