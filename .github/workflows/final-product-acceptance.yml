name: Final Product Acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  final-product-acceptance:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check all-inclusive runtime
        run: |
          node --check engines/dosage.js
          node --check engines/dosage-ui.js
          node --check engines/meet-field-au.js
          node --check engines/meet-program-ops-bridge.js
          node --check engines/meet-workspace-cy.js
          node --check engines/meet-sisc-format-dz.js
          node --check engines/meet-poolside-de.js
          node --check tests/all-inclusive-product-acceptance-20260825.cjs
          node --check tests/phone-target-stability-20260826.cjs
          node --check tests/meet-program-phone-acceptance-20260826.cjs
          node --check tests/meet-working-card-phone-acceptance-20260827.cjs
          node --check tests/meet-new-meet-phone-acceptance-20260827.cjs
          node --check tests/meet-explicit-selection-authority-20260827.cjs
          node --check tests/meet-aqgcb-alias-20260827.cjs
          node --check tests/meet-sisc-programme-authority-20260827.cjs
          node --check tests/meet-sisc-swimmer-persist-20260828.cjs
          node --check tests/matthew-ready-cv.cjs
          node --check tests/release-package.test.js
          node --check tests/fpa-runner.cjs
      - name: Install browser acceptance runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start exact candidate package
        run: |
          python3 -m http.server 8765 >/tmp/msos-final-http.log 2>&1 &
          echo $! > /tmp/msos-final-http.pid
          sleep 1
      - name: Final Product Acceptance (all tests, report all failures)
        env:
          MSOS4_TEST_URL: http://127.0.0.1:8765/
        run: node tests/fpa-runner.cjs
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/msos-final-http.log || true
