name: Morning Board check

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'engines/session-truth.js'
      - 'engines/morning-coaching.js'
      - 'app.js'
      - 'v4-correct.js'
      - 'v4-poolside-core.js'
      - 'index.html'
      - 'tests/session-truth.test.js'
      - 'tests/v4-guardian.test.js'
      - 'tests/release-package.test.js'
      - 'SHA256SUMS.txt'
      - 'manifest.webmanifest'
      - 'morning-board.html'
      - 'morning-board.js'
      - 'morning-board.css'
      - 'sw.js'
      - '.github/workflows/morning-board-check.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check engines/session-truth.js
          node --check engines/morning-coaching.js
          node --check morning-board.js
          node --check app.js
          node --check v4-correct.js
          node --check v4-poolside-core.js
          node --check sw.js
      - name: Session + coaching regression
        run: node tests/session-truth.test.js
      - name: Complete V4 Guardian
        run: node tests/v4-guardian.test.js
      - name: Release package integrity
        run: node tests/release-package.test.js
      - name: Morning Board wiring
        run: |
          grep -q 'engines/session-truth.js' morning-board.html
          grep -q 'engines/morning-coaching.js' morning-board.html
          grep -q 'morning-board.js' morning-board.html
          grep -q 'morning-board.css' morning-board.html
          grep -q 'morning-board.html' sw.js
          grep -q 'engines/morning-coaching.js' sw.js
