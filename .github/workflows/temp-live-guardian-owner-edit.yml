name: TEMP live Guardian owner edit
on:
  push:
    branches: [fix/live-guardian-boot-owner-20260825]
    paths: [.github/workflows/temp-live-guardian-owner-edit.yml]
permissions:
  contents: write
jobs:
  edit-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-guardian-boot-owner-20260825
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Edit app.js owning live Guardian paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          old="r=r||M.state.guardian?.runs?.at(-1)||M.guardian.run();"
          new="r=r||M.state.guardian?.runs?.at(-1)||{ok:false,tests:[],passed:0,total:0,at:U.now(),build:M.BUILD,contract:'device-health-not-run'};"
          if old not in s:
              raise SystemExit('renderGuardian fallback pattern not found')
          s=s.replace(old,new,1)
          old_boot="setTimeout(()=>{const r=M.guardian.run();M.state.guardian.runs.push(r);M.state.guardian.runs=M.state.guardian.runs.slice(-20);M.store.save(M.state);document.body.dataset.guardian=r.ok?'pass':'fail'},50)"
          new_boot="const lastGuardian=M.state.guardian?.runs?.at(-1);document.body.dataset.guardian=lastGuardian?.ok?'pass':'pending'"
          if old_boot not in s:
              raise SystemExit('boot Guardian pattern not found')
          s=s.replace(old_boot,new_boot,1)
          p.write_text(s)
          PY
      - name: Add regression proof
        run: |
          cat > tests/live-guardian-boot-cr.cjs <<'EOF'
          'use strict';
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const app=fs.readFileSync('app.js','utf8');
          assert.doesNotMatch(app,/setTimeout\(\(\)=>\{const r=M\.guardian\.run\(\)/,'live boot must never execute full Guardian');
          const render=app.match(/UI\.renderGuardian=r=>\{[\s\S]*?\}\);\n\}\)\(globalThis\);/);
          assert.ok(render,'Guardian renderer not found');
          assert.doesNotMatch(render[0],/\|\|M\.guardian\.run\(\)/,'opening Guardian must never fall through to full regression');
          assert.match(app,/document\.body\.dataset\.guardian=lastGuardian\?\.ok\?'pass':'pending'/,'boot should only reflect prior Guardian metadata');
          console.log('LIVE_GUARDIAN_BOOT_OWNER_PASS');
          EOF
          node --check app.js
          node tests/live-guardian-boot-cr.cjs
      - name: Commit owner fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js tests/live-guardian-boot-cr.cjs
          git commit -m "Stop full Guardian regression from live boot"
          git push origin HEAD:fix/live-guardian-boot-owner-20260825
