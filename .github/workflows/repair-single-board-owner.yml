name: Repair Single Board Owner
on:
  push:
    branches: [repair/real-checkpoint-board-owner-20260826]
    paths:
      - 'tools/repair-single-board-owner.cjs'
      - '.github/workflows/repair-single-board-owner.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/real-checkpoint-board-owner-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove all legacy Board owners and refresh asset identities
        run: node tools/repair-single-board-owner.cjs
      - name: Verify syntax and single Board authority
        run: |
          node --check app.js
          node --check v4-poolside-core.js
          node --check engines/board.js
          test "$(grep -c 'UI.renderBoard=' app.js || true)" = "0"
          test "$(grep -c 'UI.renderBoard=' v4-poolside-core.js || true)" = "0"
          test "$(grep -c 'UI.renderBoard=render' engines/board.js || true)" = "1"
          grep -q '20260826-board-single-owner' index.html
          grep -q '20260826-board-single-owner' sw.js
      - name: Commit clean runtime source
        run: |
          git config user.name 'MSOS single-owner repair'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js v4-poolside-core.js index.html sw.js SHA256SUMS.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Remove all legacy Board owners from real checkpoint'
          git push origin HEAD:repair/real-checkpoint-board-owner-20260826
