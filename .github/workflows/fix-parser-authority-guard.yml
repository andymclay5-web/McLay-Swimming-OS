name: Fix parser authority guard
on:
  push:
    branches: [rebuild/msos-coherent-product-20260826]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'actions'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/msos-coherent-product-20260826
      - name: Bind semantic parser to explicit primitive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('engines/parser-semantics.js');s=p.read_text()
          old="const M=g.MSOS4,U=M?.util,S=M?.session,P=M?.parser;if(!M||!U||!S||!P?.parse)return;"
          new="const M=g.MSOS4,U=M?.util,S=M?.session,P=M?.parser;if(!M||!U||!S||!P?.primitiveParse)return;"
          if old not in s: raise SystemExit('parser authority guard marker missing')
          p.write_text(s.replace(old,new,1))
          PY
          node --check engines/parser-semantics.js
          node tests/parser-natural-cw.cjs
      - name: Commit parser authority repair
        shell: bash
        run: |
          git config user.name 'MSOS coherent rebuild'
          git config user.email 'actions@users.noreply.github.com'
          git add engines/parser-semantics.js
          git commit -m 'Bind semantic parser to primitive parser contract'
          git push origin HEAD:rebuild/msos-coherent-product-20260826
