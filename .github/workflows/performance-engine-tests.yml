name: Performance engine tests

on:
  push:
    branches:
      - rebuild/engine-contracts-v1
    paths:
      - 'engines/standards-records.js'
      - 'engines/race-model.js'
      - 'engines/evidence-publication.js'
      - 'engines/results-pathway.js'
      - 'rebuild/portal-core.js'
      - 'tests/standards-records.test.js'
      - 'tests/race-model.test.js'
      - 'tests/evidence-publication.test.js'
      - 'tests/results-pathway.test.js'
      - 'tests/results-pathway-delegation.test.js'
      - 'tests/portal-standards-pathway.integration.test.js'
      - 'tests/performance-pipeline.integration.test.js'
      - 'tests/architecture-boundaries-extended.test.js'
      - '.github/workflows/performance-engine-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'engines/standards-records.js'
      - 'engines/race-model.js'
      - 'engines/evidence-publication.js'
      - 'engines/results-pathway.js'
      - 'rebuild/portal-core.js'
      - 'tests/standards-records.test.js'
      - 'tests/race-model.test.js'
      - 'tests/evidence-publication.test.js'
      - 'tests/results-pathway.test.js'
      - 'tests/results-pathway-delegation.test.js'
      - 'tests/portal-standards-pathway.integration.test.js'
      - 'tests/performance-pipeline.integration.test.js'
      - 'tests/architecture-boundaries-extended.test.js'
      - '.github/workflows/performance-engine-tests.yml'
  workflow_dispatch:

jobs:
  standards-records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check Standards and Records
        run: node --check engines/standards-records.js
      - name: Standards and Records regressions
        run: node tests/standards-records.test.js

  race-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check Race Model
        run: node --check engines/race-model.js
      - name: Race Model regressions
        run: node tests/race-model.test.js

  evidence-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check Evidence Publication
        run: node --check engines/evidence-publication.js
      - name: Evidence Publication regressions
        run: node tests/evidence-publication.test.js

  results-pathway-delegation:
    runs-on: ubuntu-latest
    needs: [standards-records]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check Results Pathway delegation
        run: |
          node --check engines/results-pathway.js
          node --check tests/results-pathway-delegation.test.js
      - name: Existing Results Pathway regressions
        run: node tests/results-pathway.test.js
      - name: Standards ownership delegation regressions
        run: node tests/results-pathway-delegation.test.js

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Core architecture boundaries
        run: node tests/architecture-boundaries.test.js
      - name: Extended architecture boundaries
        run: node tests/architecture-boundaries-extended.test.js

  portal-pathway:
    runs-on: ubuntu-latest
    needs: [standards-records, results-pathway-delegation, architecture]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check Portal Core standards routing
        run: |
          node --check rebuild/portal-core.js
          node --check tests/portal-standards-pathway.integration.test.js
      - name: Existing Portal Core integration
        run: node tests/portal-core.integration.test.js
      - name: Portal Standards Pathway integration
        run: node tests/portal-standards-pathway.integration.test.js

  performance-pipeline:
    runs-on: ubuntu-latest
    needs: [standards-records, race-model, evidence-publication, results-pathway-delegation, architecture, portal-pathway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check performance pipeline
        run: |
          node --check rebuild/engine-portal.js
          node --check engines/entity-registry.js
          node --check engines/evidence-retrieval.js
          node --check engines/standards-records.js
          node --check engines/race-model.js
          node --check engines/evidence-publication.js
          node --check engines/results-pathway.js
          node --check tests/performance-pipeline.integration.test.js
      - name: Portal-routed performance pipeline integration
        run: node tests/performance-pipeline.integration.test.js
