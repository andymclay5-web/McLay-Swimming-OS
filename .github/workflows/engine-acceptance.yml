name: Engine acceptance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check active runtime files
        run: |
          node --check engines/storage.js
          node --check engines/startup-gate.js
          node --check engines/guardian-runtime.js
          node --check engines/data-registry.js
          node --check engines/wa-base-times-2026.js
          node --check engines/reference-bridge.js
          node --check engines/evidence.js
          node --check engines/evidence-index.js
          node --check engines/wa-points.js
          node --check engines/session-repair.js
          node --check engines/aerobic.js
          node --check engines/race-pace.js
          node --check engines/modification.js
          node --check engines/coordinator.js
          node --check engines/bridge.js
          node --check engines/performance.js
          node --check engines/stroke-balance.js
          node --check engines/reporting.js
          node --check engines/board.js
          node --check engines/board-state.js
          node --check engines/navigation.js
          node --check engines/performance-ui.js
          node --check engines/reporting-ui.js
          node --check engines/data-admin-ui.js
          node --check engines/capture-ui.js
          node --check engines/t400-capture.js
          node --check engines/acceptance.js
          node --check sw.js
      - name: Run engine coaching regression fixtures
        run: |
          node tests/engine-acceptance.cjs
          node tests/board-evidence-regression.cjs
