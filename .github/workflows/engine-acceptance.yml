name: Engine acceptance

on:
  push:
    branches:
      - main
      - 'v4-truth-release-*'
  pull_request:

jobs:
  engine-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check active runtime files
        run: |
          node --check engines/storage.js
          node --check engines/startup-gate.js
          node --check engines/guardian-runtime.js
          node --check engines/cloud-session.js
          node --check engines/data-registry.js
          node --check engines/wa-base-times-2026.js
          node --check engines/reference-bridge.js
          node --check engines/evidence.js
          node --check engines/evidence-index.js
          node --check engines/wa-points.js
          node --check engines/session-repair.js
          node --check engines/aerobic.js
          node --check engines/race-pace.js
          node --check engines/modification.js
          node --check engines/coordinator.js
          node --check engines/bridge.js
          node --check engines/performance.js
          node --check engines/development.js
          node --check engines/stroke-balance.js
          node --check engines/reporting.js
          node --check engines/board.js
          node --check engines/board-state.js
          node --check engines/modification-edit.js
          node --check engines/navigation.js
          node --check engines/attendance-roster.js
          node --check engines/performance-ui.js
          node --check engines/reporting-ui.js
          node --check engines/data-admin-ui.js
          node --check engines/capture-ui.js
          node --check engines/t400-capture.js
          node --check engines/acceptance.js
          node --check engines/phone-fixes-ao.js
          node --check engines/amber-ratio-ap.js
          node --check engines/amber-alignment-aq.js
          node --check engines/para-pathway-ar.js
          node --check engines/amber-alignment-as.js
          node --check engines/amber-alignment-at.js
          node --check engines/presence-persistence-bc.js
          node --check architecture/interaction-core.js
          node --check architecture/athlete-session-core.js
          node --check architecture/training-history-core.js
          node --check architecture/athlete-observation-core.js
          node --check architecture/athlete-report-core.js
          node --check engines/athlete-session-bd.js
          node --check engines/swimmer-training-bd.js
          node --check engines/release-guardian-ao.js
          node --check engines/release-guardian-ap.js
          node --check engines/release-guardian-aq.js
          node --check engines/release-guardian-ar.js
          node --check engines/release-guardian-as.js
          node --check engines/release-guardian-at.js
          node --check engines/release-guardian-bc.js
          node --check engines/release-guardian-bd.js
          node --check engines/release-guardian-be.js
          node --check engines/release-guardian-bg.js
          node --check sw.js
      - name: Run engine coaching regression fixtures
        run: |
          node tests/engine-acceptance.cjs
          node tests/board-evidence-regression.cjs
          node tests/reference-data-regression.cjs
          node tests/attendance-roster-static.cjs
