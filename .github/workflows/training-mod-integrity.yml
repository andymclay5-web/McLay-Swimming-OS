name: Training modification integrity

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  training-mod-integrity:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check engines/training-mod-integrity.js
          node --check tests/training-mod-integrity-20260831.cjs
      - name: Focused regression
        run: node tests/training-mod-integrity-20260831.cjs
