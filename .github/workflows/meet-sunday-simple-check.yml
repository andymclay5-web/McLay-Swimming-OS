name: Meet Sunday Simple Check
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'engines/meet-sunday-simple.js'
      - 'tests/meet-sunday-simple-20260829.cjs'
      - '.github/workflows/meet-sunday-simple-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check engines/meet-sunday-simple.js
      - run: node tests/meet-sunday-simple-20260829.cjs
      - run: grep -q 'meet-poolside-de.js.*meet-sunday-simple.js' <(tr -d '\n' < index.html)
