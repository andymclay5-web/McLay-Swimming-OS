name: Retire Legacy Board Authority
on:
  push:
    branches: [repair/board-authority-20260825]
    paths:
      - 'tools/retire-legacy-board-authority.cjs'
      - '.github/workflows/retire-legacy-board-authority.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/board-authority-20260825
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Retire duplicate Board and TV owners
        run: node tools/retire-legacy-board-authority.cjs
      - name: Verify source remains valid and ownership is singular
        run: |
          node --check app.js
          test "$(grep -c 'UI.renderBoard=' app.js || true)" = "0"
          test "$(grep -c 'UI.renderTV=' app.js || true)" = "0"
          test "$(grep -c 'UI.renderBoard=render' engines/board.js || true)" = "1"
          test "$(grep -c 'UI.renderTV=renderTV' engines/board.js || true)" = "1"
      - name: Commit repaired owner
        run: |
          git config user.name 'MSOS authority repair'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m 'Retire duplicate legacy Board and TV runtime owners'
          git push origin HEAD:repair/board-authority-20260825
