name: Coherent MSOS product acceptance
on:
  push:
    branches: [rebuild/msos-coherent-product-20260826]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check all runtime JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r f; do node --check "$f"; done < <(find . -maxdepth 2 -type f -name '*.js' ! -path './node_modules/*' | sort)
      - name: Structural single-owner audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          html=Path('index.html').read_text()
          active=[]
          for src in re.findall(r'<script[^>]+src="([^"]+\.js)(?:\?[^\"]*)?"',html):
            path=src.split('?',1)[0]
            if Path(path).exists(): active.append(path)
          text={f:Path(f).read_text(errors='ignore') for f in active}
          checks={
            'parser':(r'\b(?:M\.parser|P)\.parse\s*=',{'engines/parser-semantics.js'}),
            'board':(r'\b(?:M\.ui|UI)\.renderBoard\s*=',{'engines/board.js'}),
            'tv':(r'\b(?:M\.ui|UI)\.renderTV\s*=',{'engines/board.js'}),
            'navigation':(r'\b(?:M\.navigationEngine|V)\.go\s*=',{'engines/navigation.js'}),
            'adaptation':(r'\b(?:M\.adapt|A)\.item\s*=',{'engines/bridge.js'}),
            'guardian':(r'\b(?:M\.guardian|G)\.run\s*=',{'engines/guardian-runtime.js'}),
            'athletes':(r'\b(?:M\.ui|UI)\.renderAthletes\s*=',{'engines/swimmer-instant-open-cn.js'}),
            'coach hub':(r'\b(?:M\.ui|UI)\.renderHub\s*=',{'engines/coach-loop-ui.js'}),
          }
          failed=[]
          for label,(pat,expected) in checks.items():
            hits=[];rx=re.compile(pat)
            for f,t in text.items():
              for m in rx.finditer(t): hits.append((f,t.count('\n',0,m.start())+1))
            owners={f for f,_ in hits}
            print(label,hits)
            if owners!=expected: failed.append((label,hits,sorted(expected)))
          forbidden=[
            r'baseRenderBoard\s*=\s*(?:M\.ui|UI)\.renderBoard',
            r'baseRenderTV\s*=\s*(?:M\.ui|UI)\.renderTV',
            r'BASE_PARSE\s*=\s*M\.parser\.parse',
            r'baseGuardianRun\s*=\s*M\.guardian\.run',
            r'baseBoard\s*=\s*UI\.renderBoard',
            r'baseAthletes\s*=\s*UI\.renderAthletes',
            r'baseSwimmer\s*=\s*UI\.renderSwimmer',
            r'baseMeet\s*=\s*UI\.renderMeet',
            r'baseOpenCapture\s*=\s*M\.actions\.openCapture',
          ]
          bad=[]
          for f,t in text.items():
            for pat in forbidden:
              if re.search(pat,t): bad.append((f,pat))
          if bad: failed.append(('captured owner wrappers',bad,[]))
          if 'engines/surface-bridge.js' not in active:
            failed.append(('surface bridge not active',[],['engines/surface-bridge.js']))
          if failed:
            print('STRUCTURAL_OWNER_AUDIT_FAIL',failed)
            sys.exit(1)
          print('STRUCTURAL_OWNER_AUDIT_PASS',len(active),'active scripts')
          PY
      - name: Run current non-browser contract tests
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/parser-natural-cw.cjs
            tests/engine-acceptance.cjs
            tests/attendance-roster-static.cjs
            tests/board-evidence-regression.cjs
            tests/friday-session-board-regression.cjs
            tests/guardian-current-runtime-bk.cjs
            tests/guardian-current-runtime-bl.cjs
            tests/guardian-device-state-bj.cjs
            tests/guardian-full-upload-contract-bj.cjs
          )
          failed=0
          for t in "${tests[@]}"; do
            if [[ -f "$t" ]]; then
              echo "===== $t ====="
              node "$t" || failed=1
            fi
          done
          exit "$failed"
      - name: Install browser acceptance dependency
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Run product in local-first browser fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 >/tmp/msos-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 0.25; done
          tests=(
            tests/final-product-acceptance-20260825.cjs
            tests/all-inclusive-product-acceptance-20260825.cjs
          )
          failed=0
          for t in "${tests[@]}"; do
            if [[ -f "$t" ]]; then
              echo "===== $t ====="
              MSOS4_TEST_URL=http://127.0.0.1:8765/ node "$t" || failed=1
            fi
          done
          exit "$failed"
