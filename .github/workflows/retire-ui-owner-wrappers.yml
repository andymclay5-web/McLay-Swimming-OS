name: Retire remaining UI owner wrappers
on:
  push:
    branches: [rebuild/msos-coherent-product-20260826]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'actions'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/msos-coherent-product-20260826
      - name: Convert athlete and hub decorators to surface bridge consumers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('engines/para-pathway-ar.js'); s=p.read_text()
          old="const priorRender=UI.renderAthletes?.bind(UI);if(priorRender)UI.renderAthletes=()=>{priorRender();queueMicrotask(decorate);requestAnimationFrame(decorate);};if(M.performanceUI)M.performanceUI.render=UI.renderAthletes;"
          new="M.surfaceBridge?.register?.('athletes','para-pathway-ar',()=>{queueMicrotask(decorate);requestAnimationFrame(decorate);});"
          if old not in s: raise SystemExit('para athlete wrapper marker missing')
          p.write_text(s.replace(old,new,1))

          p=Path('engines/swimmer-training-bd.js'); s=p.read_text()
          old="function install(){const base=M.ui.renderAthletes?.bind(M.ui);if(base&&!X._wrapped){X._wrapped=true;M.ui.renderAthletes=(...args)=>{const out=base(...args);requestAnimationFrame(render);return out;};if(M.performanceUI)M.performanceUI.render=M.ui.renderAthletes;}const h=document.querySelector('#athletesView');if(h&&!X._tabBound){X._tabBound=true;h.addEventListener('click',e=>{if(e.target.closest?.('[data-msos-ath-tab=\"training\"]'))requestAnimationFrame(render);});}requestAnimationFrame(render);}"
          new="function install(){if(!X._bridged){X._bridged=true;M.surfaceBridge?.register?.('athletes','swimmer-training-bd',()=>requestAnimationFrame(render));}const h=document.querySelector('#athletesView');if(h&&!X._tabBound){X._tabBound=true;h.addEventListener('click',e=>{if(e.target.closest?.('[data-msos-ath-tab=\"training\"]'))requestAnimationFrame(render);});}requestAnimationFrame(render);}"
          if old not in s: raise SystemExit('training athlete wrapper marker missing')
          p.write_text(s.replace(old,new,1))

          p=Path('engines/reporting-ui.js'); s=p.read_text()
          old="const baseHub=M.ui?.renderHub?.bind(M.ui);if(baseHub)M.ui.renderHub=(...a)=>{const out=baseHub(...a),host=document.querySelector('#hubView');if(host&&!host.querySelector('[data-msos-reports]'))host.insertAdjacentHTML('afterbegin','<section class=\"page-card\"><div class=\"eyebrow\">REPORTING</div><div class=\"hub-actions\"><button data-msos-reports>Reports · squad / swimmer / evidence</button></div></section>');M.dataAdminUI?.ensureShortcut?.('hub');return out;};"
          new="M.surfaceBridge?.register?.('hub','reporting-shortcut',()=>{const host=document.querySelector('#hubView');if(host&&!host.querySelector('[data-msos-reports]'))host.insertAdjacentHTML('afterbegin','<section class=\"page-card\"><div class=\"eyebrow\">REPORTING</div><div class=\"hub-actions\"><button data-msos-reports>Reports · squad / swimmer / evidence</button></div></section>');M.dataAdminUI?.ensureShortcut?.('hub');});"
          if old not in s: raise SystemExit('reporting Hub wrapper marker missing')
          p.write_text(s.replace(old,new,1))
          PY
          node --check engines/para-pathway-ar.js
          node --check engines/swimmer-training-bd.js
          node --check engines/reporting-ui.js
      - name: Commit wrapper retirement
        shell: bash
        run: |
          git config user.name 'MSOS coherent rebuild'
          git config user.email 'actions@users.noreply.github.com'
          git add engines/para-pathway-ar.js engines/swimmer-training-bd.js engines/reporting-ui.js
          git commit -m 'Move athlete and Hub decorators onto explicit surface bridge'
          git push origin HEAD:rebuild/msos-coherent-product-20260826
