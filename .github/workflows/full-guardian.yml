name: Full Guardian

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  guardian:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check active runtime
        run: |
          node --check app.js
          node --check v4-correct.js
          node --check v4-poolside-core.js
          node --check sw.js
          node --check engines/guardian-runtime.js
          node --check engines/stability-identity-bh.js
          node --check engines/guardian-device-state-bj.js
          node --check engines/privacy-hardening-bk.js
          node --check engines/release-guardian-bj.js
          node --check engines/release-guardian-bk.js
          node --check engines/release-guardian-bl.js
          for f in architecture/*-core.js; do node --check "$f"; done
      - name: Session truth regression
        run: node tests/session-truth.test.js
      - name: Complete V4 Guardian
        run: node tests/v4-guardian.test.js
      - name: Engine regression
        run: |
          node tests/engine-acceptance.cjs
          node tests/board-evidence-regression.cjs
          node tests/friday-session-board-regression.cjs
          node tests/reference-data-regression.cjs
          node tests/reference-authority-identity.cjs
          node tests/attendance-roster-static.cjs
          node tests/stability-identity-bh.cjs
          node tests/guardian-device-state-bj.cjs
          node tests/guardian-current-runtime-bk.cjs
          node tests/guardian-current-runtime-bl.cjs
          node tests/guardian-runtime-order-bl.cjs
          node tests/live-guardian-regressions-20260824.cjs
      - name: Architecture regression
        run: |
          node architecture/architecture.test.js
          node architecture/runtime.test.js
          node architecture/vision-surface.test.js
          node architecture/v4-adapter.test.js
          node architecture/learning-sync.test.js
          node architecture/training-history.test.js
          node architecture/athlete-session.test.js
          node architecture/athlete-report.test.js
          node architecture/athlete-observation.test.js
      - name: Guardian upload contract
        run: node tests/guardian-full-upload-contract-bj.cjs
      - name: Release package integrity
        run: node tests/release-package.test.js
      - name: Morning Board wiring
        run: |
          grep -q 'engines/session-truth.js' morning-board.html
          grep -q 'engines/morning-coaching.js' morning-board.html
          grep -q 'morning-board.js' morning-board.html
          grep -q 'morning-board.css' morning-board.html
          grep -q 'morning-board.html' sw.js
          grep -q 'engines/morning-coaching.js' sw.js
