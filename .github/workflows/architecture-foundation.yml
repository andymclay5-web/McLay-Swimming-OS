name: Architecture Foundation

on:
  push:
    branches:
      - main
      - 'v4-architecture-*'
    paths:
      - 'architecture/**'
      - 'ARCHITECTURE_20260822.md'
      - '.github/workflows/architecture-foundation.yml'
  pull_request:
    paths:
      - 'architecture/**'
      - 'ARCHITECTURE_20260822.md'
      - '.github/workflows/architecture-foundation.yml'

jobs:
  architecture-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check architecture modules
        run: |
          for f in architecture/*-core.js; do node --check "$f"; done
          node --check architecture/poolside-runtime.js
      - name: Run architecture contract tests
        run: node architecture/architecture.test.js
      - name: Run end-to-end poolside runtime tests
        run: node architecture/runtime.test.js
      - name: Run voice Board swimmer and Meet surface tests
        run: node architecture/vision-surface.test.js
      - name: Run current v4 adapter tests
        run: node architecture/v4-adapter.test.js
      - name: Run learning replication and consent tests
        run: node architecture/learning-sync.test.js
