name: Fix coherent meet syntax
on:
  push:
    branches: [rebuild/msos-coherent-product-20260826]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    if: github.actor != 'actions'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/msos-coherent-product-20260826
      - name: Repair malformed meet-intelligence callback boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('engines/meet-intelligence-ax.js')
          s=p.read_text()
          old='M.meetOpsEngine?.render?.();setTimeout(render,0)}})};'
          new='M.meetOpsEngine?.render?.();setTimeout(render,0)}});'
          if old not in s:
              raise SystemExit('expected malformed callback boundary not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check engines/meet-intelligence-ax.js
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'MSOS coherent rebuild'
          git config user.email 'actions@users.noreply.github.com'
          git add engines/meet-intelligence-ax.js
          git commit -m 'Fix meet intelligence syntax boundary'
          git push origin HEAD:rebuild/msos-coherent-product-20260826
