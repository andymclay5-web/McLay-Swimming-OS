<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d4566"><title>MSOS Poolside Emergency</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f7f8;color:#102631}header{position:sticky;top:0;z-index:10;background:#0d4566;color:#fff;padding:10px 12px}header b{font-size:18px}header small{display:block;opacity:.85}.wrap{padding:10px}.status{padding:10px;border-radius:10px;background:#fff;margin-bottom:10px}.swimstrip,.heatstrip{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;-webkit-overflow-scrolling:touch;padding:6px 2px 12px;scroll-snap-type:x proximity}.swimstrip button,.heatstrip button{flex:0 0 auto;scroll-snap-align:start;border:1px solid #9eb5c0;background:#fff;border-radius:12px;padding:10px;text-align:left;min-height:68px}.swimstrip button{width:130px}.heatstrip button{width:245px}.heatstrip button div{font-weight:800;font-size:16px}.heatstrip button span,.swimstrip button span{display:block;font-size:13px;margin-top:3px}.heatstrip strong,.swimstrip strong{font-size:17px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:10px 2px 2px}.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 8px}.nav button{min-height:48px;font-weight:800;border-radius:10px;border:1px solid #9eb5c0;background:#fff}.card{background:#fff;border:2px solid #0d4566;border-radius:14px;padding:10px;margin:8px 0}.card h2{margin:0 0 3px;font-size:19px}.race{border-top:1px solid #d9e2e6;padding:10px 0}.race:first-of-type{border-top:0}.raceTop{display:flex;justify-content:space-between;gap:8px}.raceTop b{font-size:17px}.seed{font-size:20px;font-weight:900}.meta{font-size:13px;color:#49616d}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.actions button,.actions label{min-height:44px;border-radius:9px;border:1px solid #9eb5c0;background:#f7fbfd;font-weight:700;display:flex;align-items:center;justify-content:center}.actions input{display:none}.notes{width:100%;min-height:70px;margin-top:8px;padding:8px;border-radius:8px;border:1px solid #9eb5c0}.hidden{display:none}.err{background:#ffe7e7;color:#7a1010}</style></head><body><header><b>SISC · POOLSIDE EMERGENCY</b><small>Direct from saved MSOS race data</small></header><div class="wrap"><div id="status" class="status">Loading saved SISC entries…</div><div id="app" class="hidden"><div class="sectionTitle"><b>SWIMMERS</b><small>Swipe →</small></div><div id="swimmers" class="swimstrip"></div><div class="sectionTitle"><b>AQUAGYM HEATS</b><small id="count"></small></div><div class="nav"><button id="prev">◀ PREV HEAT</button><button id="next">NEXT HEAT ▶</button></div><div id="heats" class="heatstrip"></div><div id="detail"></div></div></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const txt=s=>String(s??'').replace(/\s+/g,' ').trim();
function fmt(v){let n=Number(v);if(!Number.isFinite(n))return 'NT';let m=Math.floor(n/60),s=(n-m*60).toFixed(2).padStart(5,'0');return m?m+':'+s:s}
function seed(r){return txt(r.seed_time)||(Number.isFinite(Number(r.seed_seconds))?fmt(r.seed_seconds):'NT')}
function athleteName(r,state){let a=(state.athletes||[]).find(x=>x.id===r.athlete_id);return txt(a?.preferred_name||a?.nickname||a?.full_name||r.athlete_name||r.source_name||'Swimmer')}
function findDeck(root){let seen=new Set(),best=null;function walk(x,d=0){if(!x||typeof x!=='object'||seen.has(x)||d>8)return;seen.add(x);if(Array.isArray(x.races)&&x.races.length){let score=x.races.filter(r=>r&&(!r.relay)&&(r.athlete_id||r.athlete_name)).length;if(/south|sisc/i.test(String(x.title||x.name||'')))score+=1000;if(!best||score>best.score)best={deck:x,score}}if(Array.isArray(x)){for(let v of x)walk(v,d+1)}else{for(let k of Object.keys(x))walk(x[k],d+1)}}walk(root);return best?.deck||null}
function idbGet(){return new Promise((resolve,reject)=>{let q=indexedDB.open('mclay_swimming_v4_operational_state');q.onerror=()=>reject(q.error);q.onsuccess=()=>{let db=q.result;let names=[...db.objectStoreNames];if(!names.length)return resolve(null);let store=names.includes('state')?'state':names[0];let tx=db.transaction(store,'readonly'),os=tx.objectStore(store);let g=os.get('latest');g.onsuccess=()=>resolve(g.result);g.onerror=()=>reject(g.error)}})}
function localFallback(){for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);try{let v=JSON.parse(localStorage.getItem(k));if(findDeck(v))return v}catch{}}return null}
let STATE=null,RACES=[],HEATS=[],selected=0;
function build(root){STATE=root?.state||root?.value||root?.data||root||{};let deck=STATE.meetFieldDeck||findDeck(STATE);if(!deck)throw new Error('No saved Meet deck found');RACES=(deck.races||[]).filter(r=>!r.relay&&(r.athlete_id||r.athlete_name));if(!RACES.length)throw new Error('No AquaGym race entries found');let m=new Map();for(let r of RACES.sort((a,b)=>(a.event_number||0)-(b.event_number||0)||(a.heat||0)-(b.heat||0)||(a.lane||0)-(b.lane||0))){let k=[r.event_number||0,r.heat||0,txt(r.start_time)].join('|');if(!m.has(k))m.set(k,{key:k,event:r.event_number||0,heat:r.heat||0,start:txt(r.start_time),label:txt(r.event)||`${r.distance||''} ${r.stroke||''}`,races:[]});m.get(k).races.push(r)}HEATS=[...m.values()];render()}
function render(){let sm=new Map();for(let r of RACES){let n=athleteName(r,STATE);if(!sm.has(n))sm.set(n,[]);sm.get(n).push(r)}$('#swimmers').innerHTML=[...sm].map(([n,rs])=>{let r=rs[0];return `<button data-sw="${esc(n)}"><b>${esc(n.split(' ')[0])}</b><span>E${r.event_number} · H${r.heat} L${r.lane}</span><strong>${esc(seed(r))}</strong></button>`}).join('');$('#heats').innerHTML=HEATS.map((h,i)=>`<button data-hi="${i}"><div>E${h.event} · HEAT ${h.heat}</div><span>${esc(h.start||'')} · ${esc(h.label)}</span>${h.races.map(r=>`<span>${esc(athleteName(r,STATE))} · L${r.lane} · <strong>${esc(seed(r))}</strong></span>`).join('')}</button>`).join('');$('#count').textContent=`${HEATS.length} heats · ${RACES.length} starts`;showHeat(Math.min(selected,HEATS.length-1));$('#status').textContent='Loaded from saved MSOS data';$('#app').classList.remove('hidden')}
function showHeat(i){if(!HEATS.length)return;selected=Math.max(0,Math.min(HEATS.length-1,i));let h=HEATS[selected];$('#detail').innerHTML=`<div class="card"><h2>E${h.event} · HEAT ${h.heat}</h2><div class="meta">${esc(h.start||'')} · ${esc(h.label)}</div>${h.races.map(r=>`<div class="race"><div class="raceTop"><div><b>${esc(athleteName(r,STATE))}</b><div class="meta">Lane ${r.lane||'—'} · E${r.event_number}</div></div><div class="seed">${esc(seed(r))}</div></div><textarea class="notes" data-note="${esc(athleteName(r,STATE))}" placeholder="Quick race note"></textarea><div class="actions"><label>VIDEO<input type="file" accept="video/*" capture="environment"></label><label>PHOTO<input type="file" accept="image/*" capture="environment"></label></div></div>`).join('')}</div>`;let b=$(`[data-hi="${selected}"]`);b?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}
document.addEventListener('click',e=>{let h=e.target.closest('[data-hi]');if(h)return showHeat(Number(h.dataset.hi));let s=e.target.closest('[data-sw]');if(s){let n=s.dataset.sw,i=HEATS.findIndex(h=>h.races.some(r=>athleteName(r,STATE)===n));if(i>=0)showHeat(i)}});$('#prev').onclick=()=>showHeat(selected-1);$('#next').onclick=()=>showHeat(selected+1);
(async()=>{try{let root=await idbGet();if(!root)root=localFallback();build(root)}catch(e){$('#status').classList.add('err');$('#status').textContent='Could not read saved MSOS Meet data: '+e.message}})();
</script></body></html>
